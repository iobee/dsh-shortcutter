name: Verify plugin installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
          run_install: false
      - run: npm run build
      - run: npm test
      - run: npm run check --if-present
      - run: npm run test:install
